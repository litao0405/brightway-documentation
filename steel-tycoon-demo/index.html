<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081a2a">
<title>钢铁大亨｜在线试玩</title>
<style>
:root{--blue:#117ac1;--deep:#071a2b;--metal:#193a54;--gold:#ffbd2e;--orange:#f87800;--green:#55c947;--red:#eb4940}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 10%,#3d8cc1 0,#153f60 32%,#06131f 82%);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:white}
button{font:inherit;color:inherit}
#game{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));margin:auto;overflow:hidden;background:linear-gradient(#4ca9e0 0 17%,#83b975 17% 35%,#355e4b 35% 100%);box-shadow:0 0 45px #000;border-radius:min(2vw,14px);isolation:isolate}
#game:before{content:"";position:absolute;inset:16% 0 13%;background:linear-gradient(25deg,transparent 47%,#719d5e 48% 52%,transparent 53%) 0 0/120px 70px,linear-gradient(-25deg,transparent 47%,#719d5e 48% 52%,transparent 53%) 0 0/120px 70px,radial-gradient(ellipse at 70% 15%,#6bb5d9 0 7%,transparent 7.4%),linear-gradient(#6f9e62,#2e5647);opacity:.9;z-index:-3}
#game:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 25px #00111fcc;z-index:90}
.cloud{position:absolute;top:12%;width:120px;height:28px;border-radius:50%;background:#fff8;filter:blur(2px);animation:cloud 22s linear infinite;z-index:-1}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff9;border-radius:50%}.cloud:before{width:50px;height:50px;left:22px;top:-22px}.cloud:after{width:62px;height:40px;left:57px;top:-15px}.c2{top:18%;left:55%;transform:scale(.6);animation-duration:29s;animation-delay:-12s}@keyframes cloud{from{left:-35%}to{left:110%}}
.top{height:10.5%;display:flex;align-items:center;padding:1.2% 2%;gap:1.4%;background:linear-gradient(#0f4268,#061b2d);border-bottom:3px solid #4f91bb;box-shadow:0 4px 12px #0008;z-index:30;position:relative}
.avatar{width:18%;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-size:clamp(30px,10vw,54px);background:linear-gradient(145deg,#ffe066,#ff9c16);border:3px solid #d7f1ff;box-shadow:inset 0 2px #fff8,0 4px 7px #0008}
.title{min-width:29%}.title b{display:block;font-size:clamp(17px,5.1vw,27px);text-shadow:0 3px #05223a}.lv{display:inline-block;margin-top:3px;padding:3px 13px;border-radius:10px;background:linear-gradient(#ffca3d,#ee7b00);font-size:clamp(11px,3vw,15px);font-weight:900;box-shadow:0 3px #a44500}
.resources{margin-left:auto;display:grid;gap:5px;min-width:41%}.res{height:31px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:17px;background:linear-gradient(#183f5e,#071d30);border:2px solid #6fa7c8;font-weight:900;font-size:clamp(11px,3.2vw,16px);box-shadow:inset 0 1px #fff5,0 3px 5px #0007}.add{width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(#88df5a,#259d2c);border:1px solid #d8ffc9}
.side{position:absolute;z-index:25;top:12%;width:17%;display:grid;gap:8px}.left{left:1.5%}.right{right:1.5%}.sideBtn{position:relative;padding:7px 2px;border:2px solid #8cb4cd;border-radius:13px;background:linear-gradient(#244e6c,#0b2437);box-shadow:0 4px 8px #0009;text-align:center;font-weight:900;font-size:clamp(10px,2.7vw,13px)}.sideBtn i{display:block;font-style:normal;font-size:clamp(24px,8vw,40px)}.dot{position:absolute;right:-4px;top:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--red);border:2px solid white;font-weight:900}
.map{position:absolute;left:0;right:0;top:10.5%;bottom:25%;perspective:800px;overflow:hidden}
.road{position:absolute;height:9px;border-radius:8px;background:linear-gradient(#ffdc5b,#f26b00 45%,#9b2c00 55%,#ffad1e);box-shadow:0 0 12px #ff6a00,0 0 4px #fff inset;transform-origin:left center;z-index:1}.r1{left:28%;top:34%;width:31%;transform:rotate(22deg)}.r2{left:51%;top:43%;width:30%;transform:rotate(30deg)}.r3{left:31%;top:54%;width:36%;transform:rotate(-6deg)}.r4{left:24%;top:49%;width:24%;transform:rotate(-45deg)}.r5{left:39%;top:65%;width:29%;transform:rotate(26deg)}
.node{position:absolute;z-index:5;border:0;background:transparent;text-align:center;cursor:pointer;filter:drop-shadow(0 7px 5px #0007);animation:idle 2.3s ease-in-out infinite}.node:active{transform:scale(.96)}@keyframes idle{50%{translate:0 -2px}}
.building{position:relative;margin:auto;width:82%;height:65%;border-radius:16px 16px 9px 9px;background:linear-gradient(145deg,#607c8d,#253b4b 55%,#101d27);border:3px solid #abc4d3;box-shadow:inset 0 3px #fff4,0 0 0 4px #152736,0 7px 8px #0008;overflow:visible}
.building:before{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:27%;background:repeating-linear-gradient(90deg,#fd8b00 0 9%,#ffdf45 10% 16%,#c73b00 17% 24%);border:2px solid #ffcd69;box-shadow:0 0 15px #ff6500}
.stack{position:absolute;width:17%;height:65%;bottom:65%;border-radius:5px 5px 0 0;background:repeating-linear-gradient(#d4e1e8 0 14%,#d64a3f 15% 28%);border:2px solid #203747}.stack.a{left:13%}.stack.b{right:13%;height:52%}
.flame{position:absolute;left:39%;top:-20%;font-size:clamp(22px,7vw,39px);filter:drop-shadow(0 0 10px #ff5b00);animation:fire .7s ease-in-out infinite alternate}@keyframes fire{to{transform:translateY(-4px) scale(1.12)}}
.label{display:inline-block;margin-top:-1px;padding:3px 9px;border-radius:8px;background:linear-gradient(#263f52,#0c1b25);border:2px solid #738b9a;box-shadow:0 3px 4px #0008;font-weight:900;font-size:clamp(11px,3.1vw,15px);white-space:nowrap}.label em{display:block;font-style:normal;color:#ffca31;font-size:.82em}
#bf{left:17%;top:11%;width:36%;height:31%}#bof{left:48%;top:25%;width:31%;height:28%;animation-delay:.25s}#cast{left:31%;top:48%;width:31%;height:23%;animation-delay:.5s}#roll{left:60%;top:53%;width:38%;height:29%;animation-delay:.75s}#coke{left:2%;top:51%;width:28%;height:26%;animation-delay:1s}#energy{left:30%;top:71%;width:34%;height:23%;animation-delay:1.2s}
#roll .building{background:linear-gradient(145deg,#718897,#24394a 60%,#13212b);border-color:#ffd36c;box-shadow:inset 0 3px #fff4,0 0 0 4px #152736,0 0 17px #ff9a20}#energy .building:before{content:"⚡";display:grid;place-items:center;background:#0c76b7;color:#bff3ff;font-size:25px}#coke .building:before{background:linear-gradient(#12191f,#4b3525);box-shadow:0 0 9px #222}
.warn{position:absolute;right:-3%;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);border:3px solid white;font-weight:900;animation:pulse .9s infinite}@keyframes pulse{50%{transform:scale(1.14);box-shadow:0 0 15px #ff312a}}
.bubble{position:absolute;z-index:18;padding:6px 8px;border-radius:16px;background:linear-gradient(#76dc56,#2d9c31);border:2px solid #f5ffd6;box-shadow:0 4px 7px #0008,0 0 12px #c9ff92;font-size:clamp(9px,2.5vw,12px);font-weight:900;animation:bob 1.2s infinite}.b1{left:41%;top:23%}.b2{right:21%;top:38%;animation-delay:.5s}@keyframes bob{50%{transform:translateY(-5px)}}
.mission{position:absolute;z-index:35;left:2%;right:2%;bottom:12.8%;height:12.3%;display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:18px;background:linear-gradient(145deg,#eefdff,#b8dbf2);border:4px solid #2377b6;box-shadow:0 5px 9px #0008;color:#12283a}.robot{font-size:clamp(40px,13vw,68px);filter:drop-shadow(0 3px 2px #0004)}.missionText{flex:1;min-width:0}.missionText b{font-size:clamp(11px,3.2vw,16px)}.missionText small{display:block;margin:2px 0;color:#34566d;font-size:clamp(8px,2.3vw,11px)}.bar{height:11px;border-radius:8px;background:#344c5e;overflow:hidden;border:1px solid #7f9db1}.bar i{display:block;height:100%;width:66%;background:linear-gradient(90deg,#4bb532,#9de44c)}.cta{border:2px solid #fff3a7;border-radius:12px;padding:8px 9px;background:linear-gradient(#ffca3c,#ef7900);font-weight:900;text-shadow:0 2px #9b3d00;box-shadow:0 4px #a84a00;font-size:clamp(10px,2.8vw,14px)}
.nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:13%;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 3px;background:linear-gradient(#1a354c,#081823);border-top:3px solid #6c91a9;box-shadow:0 -5px 10px #0008}.nav button{position:relative;border:2px solid #405c70;border-radius:12px;background:linear-gradient(145deg,#24475f,#0d2536);font-weight:900;font-size:clamp(10px,3.5vw,17px);text-shadow:0 2px #000;box-shadow:inset 0 2px #fff2}.nav i{display:block;font-style:normal;font-size:clamp(24px,8vw,43px)}.nav .active{border-color:#ffd054;box-shadow:0 0 15px #ff9800,inset 0 2px #fff4;background:linear-gradient(#6a4a1e,#2c241e)}
#overlay{position:absolute;z-index:100;inset:0;display:none;background:#020a11b8;backdrop-filter:blur(2px)}#overlay.show{display:block}.panel{position:absolute;left:2%;right:2%;bottom:1.5%;max-height:88%;overflow:auto;padding:12px;border-radius:20px;background:linear-gradient(155deg,#184362,#081d30 70%);border:3px solid #75acd0;box-shadow:0 -8px 30px #000c,inset 0 1px #fff5;animation:up .22s ease-out}@keyframes up{from{transform:translateY(35px);opacity:.2}}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:9px}.ph .ico{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(#38a9eb,#0b4e84);border:2px solid #bce7ff;font-size:27px}.ph h2{margin:0;font-size:20px}.ph p{margin:2px 0 0;color:#bed6e6;font-size:11px}.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid #ffd0d0;background:linear-gradient(#ff6a61,#ad1c25);font-size:20px;font-weight:900}
.card{margin:8px 0;padding:11px;border-radius:15px;background:linear-gradient(145deg,#f8fdff,#c6e0f1);border:2px solid #577c96;box-shadow:0 4px 8px #0007;color:#112333}.dark{background:linear-gradient(145deg,#1b4564,#0b2438);color:#fff}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.muted{color:#587081;font-size:11px}.dark .muted{color:#b9d1e1}.tag{display:inline-block;padding:2px 7px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:900}.green{background:#38a63d}.gold{background:#e99500}.gbtn{border:2px solid #fff1a8;border-radius:12px;padding:8px 10px;background:linear-gradient(#ffcc3f,#ee7900);font-weight:900;text-shadow:0 2px #a34500;box-shadow:0 4px #a64b00}.gbtn:active{transform:translateY(3px);box-shadow:0 1px #a64b00}.gbtn.good{background:linear-gradient(#8be161,#2ca43a);box-shadow:0 4px #187428;text-shadow:0 2px #187428}.gbtn.gray{background:linear-gradient(#8b9ba6,#4d5c67);box-shadow:0 4px #2d363c;text-shadow:none}.wide{width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.facility{text-align:center;min-height:138px}.facility .fi{font-size:39px}.facility h3{margin:2px}.facility p{min-height:27px;margin:2px 0 8px;font-size:10px;color:#526d7e}.locked{filter:grayscale(.9);opacity:.68}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:9px;border-radius:12px;background:#09243a;border:2px solid #416984;text-align:center}.stat b{display:block;color:#ffd25a;font-size:18px}.stat span{font-size:10px;color:#b9d1e1}.meter{display:flex;align-items:center;gap:7px;margin:9px 0}.meter strong{width:65px;font-size:11px}.meter .bar{flex:1}.toggle{width:47px;height:25px;border-radius:14px;border:2px solid #8299a8;background:#52636e;position:relative}.toggle:after{content:"";position:absolute;width:17px;height:17px;left:3px;top:2px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:#38ae45}.toggle.on:after{left:23px}
#toast{position:absolute;z-index:300;left:50%;top:12%;transform:translate(-50%,-12px);opacity:0;min-width:58%;padding:9px 12px;border-radius:13px;background:#102b42ed;border:2px solid #ffe38b;text-align:center;font-weight:900;box-shadow:0 5px 12px #000b;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}.fly{position:absolute;z-index:250;color:#ffe650;font-weight:900;text-shadow:0 2px #793100;animation:fly 1s forwards}@keyframes fly{to{transform:translateY(-55px) scale(1.3);opacity:0}}
#splash{position:absolute;z-index:500;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2185bd,#07192b 66%);transition:.45s}.logo{text-align:center;animation:logo 1.2s infinite}.logo div{font-size:80px}.logo h1{margin:0;font-size:38px;text-shadow:0 4px #083452,0 0 15px #81d7ff}.logo b{display:inline-block;margin-top:9px;padding:7px 18px;border-radius:17px;background:linear-gradient(#ffcd42,#ee7900);box-shadow:0 4px #9b4100}@keyframes logo{50%{transform:scale(1.035)}}
@media(max-height:650px){.top{height:10%}.map{top:10%;bottom:24%}.mission{height:11.5%}.nav{height:12.5%}.panel{max-height:93%;padding:8px}.card{margin:5px 0;padding:8px}.facility{min-height:116px}.facility .fi{font-size:31px}}
</style>
</head>
<body>
<div id="game">
<div id="splash"><div class="logo"><div>👷‍♂️</div><h1>钢铁大亨</h1><b>正在点燃第一炉钢…</b></div></div>
<div class="top"><div class="avatar">👷‍♂️</div><div class="title"><b>钢铁大亨</b><span class="lv">Lv.<span id="playerLv">8</span></span></div><div class="resources"><div class="res">🪙 <span id="coins">2.60万</span><span class="add">＋</span></div><div class="res">⭐ 声望 <span id="rep">1</span><span class="add">＋</span></div></div></div>
<div class="cloud"></div><div class="cloud c2"></div>
<div class="side left"><button class="sideBtn" id="daily"><span class="dot">!</span><i>📋</i>每日任务</button><button class="sideBtn" id="gift"><span class="dot">•</span><i>🎁</i>七日福利</button></div>
<div class="side right"><button class="sideBtn" id="order"><i>🌀</i>订单 <span id="orderMini">32/50</span></button><button class="sideBtn" id="chest"><span class="dot">•</span><i>🧰</i>在线奖励</button></div>
<div class="map"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div><div class="road r5"></div>
<button class="node" id="bf"><div class="building"><span class="stack a"></span><span class="stack b"></span><span class="flame">🔥</span></div><span class="label">高炉<em>Lv.<span>3</span></em></span></button>
<button class="node" id="bof"><div class="building"><span class="stack a"></span><span class="flame">🔥</span></div><span class="label">转炉<em>Lv.<span>2</span></em></span></button>
<button class="node" id="cast"><div class="building"><span class="stack b"></span></div><span class="label">连铸<em>Lv.<span>2</span></em></span></button>
<button class="node" id="roll"><span class="warn">!</span><div class="building"><span class="stack b"></span></div><span class="label">热轧<em>Lv.<span>2</span></em></span></button>
<button class="node" id="coke"><div class="building"><span class="stack a"></span><span class="stack b"></span></div><span class="label">焦化<em>Lv.<span>2</span></em></span></button>
<button class="node" id="energy"><div class="building"><span class="stack a"></span></div><span class="label">能源中心<em>Lv.<span>3</span></em></span></button>
<button class="bubble b1" data-earn="1800">🪙 可领取</button><button class="bubble b2" data-earn="1600">🪙 可领取</button></div>
<button class="mission" id="mission"><span class="robot">🤖</span><span class="missionText"><b>主线任务：升级热轧到 Lv.3</b><small>疏通产能瓶颈，提升全厂收益！</small><span class="bar"><i></i></span></span><span class="cta">前往升级</span></button>
<div class="nav"><button class="active" id="navFactory"><i>🏭</i>工厂</button><button id="navOrder"><span class="dot">!</span><i>📋</i>订单</button><button id="navExpand"><i>🏗️</i>扩建</button><button id="navEnergy"><i>⚡</i>能源</button><button id="navHq"><i>🏢</i>总部</button></div>
<div id="overlay"><section class="panel" id="panel"></section></div><div id="toast"></div>
</div>
<script>
(()=>{const K='steelTycoonDirectV1',D={coins:26000,rep:1,steel:32,total:32,orders:0,lv:{bf:3,bof:2,cast:2,roll:2,coke:2,energy:3},built:{raw:0,sinter:0,pellet:0,pretreat:0,lf:0,rh:0},toggle:{gas:1,heat:0,water:1},daily:0,gift:1};let S;try{let x=JSON.parse(localStorage.getItem(K)||'{}');S={...D,...x,lv:{...D.lv,...(x.lv||{})},built:{...D.built,...(x.built||{})},toggle:{...D.toggle,...(x.toggle||{})}}}catch(e){S=JSON.parse(JSON.stringify(D))}const $=s=>document.querySelector(s),F=n=>n>=10000?(n/10000).toFixed(n>99999?0:2)+'万':Math.floor(n)+'',N={bf:'高炉',bof:'转炉',cast:'连铸',roll:'热轧',coke:'焦化',energy:'能源中心'},I={bf:'🔥',bof:'🏭',cast:'🧱',roll:'🌀',coke:'⚫',energy:'⚡'};let tt,a;
function save(){localStorage.setItem(K,JSON.stringify(S))}
function sound(f=560){try{a=a||new(AudioContext||webkitAudioContext);let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.055,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.08)}catch(e){}}
function hud(){$('#coins').textContent=F(S.coins);$('#rep').textContent=S.rep;$('#playerLv').textContent=Math.max(...Object.values(S.lv))+5;$('#orderMini').textContent=Math.min(50,Math.floor(S.steel))+'/50';Object.keys(S.lv).forEach(k=>{let e=$('#'+k+' .label span');if(e)e.textContent=S.lv[k]})}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1700)}
function earn(n,x=50,y=35){S.coins+=n;hud();let e=document.createElement('div');e.className='fly';e.textContent='＋'+F(n)+' 🪙';e.style.left=x+'%';e.style.top=y+'%';$('#game').append(e);setTimeout(()=>e.remove(),1050);sound(760);save()}
function close(){$('#overlay').classList.remove('show');save()}
function open(t,i,s,b){$('#panel').innerHTML=`<div class="ph"><div class="ico">${i}</div><div><h2>${t}</h2><p>${s}</p></div><button class="x">×</button></div>${b}`;$('#overlay').classList.add('show');$('.x').onclick=close;sound(460)}
$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};
const bottleneck=()=>Object.entries({bf:S.lv.bf,bof:S.lv.bof,cast:S.lv.cast,roll:S.lv.roll}).sort((a,b)=>a[1]-b[1])[0][0],cost=k=>Math.round(5000*1.72**(S.lv[k]-1));
function building(k){let c=cost(k),bn=bottleneck()===k;open(N[k]+' · Lv.'+S.lv[k],I[k],bn?'当前产能瓶颈，优先升级可显著增产':'设备运行稳定，持续创造经营收益',`<div class="card dark"><div class="row between"><div><span class="tag ${bn?'':'green'}">${bn?'产能瓶颈':'运行中'}</span><h3>产能 ${22*S.lv[k]} 吨/分钟</h3><p class="muted">效率 ${86+2*S.lv[k]}% · 健康度 100%</p></div><b style="font-size:48px">${I[k]}</b></div><div class="bar"><i style="width:${35+S.lv[k]*14}%"></i></div></div><div class="card row between"><div><b>升级到 Lv.${S.lv[k]+1}</b><p class="muted">产能 +18% · 收益 +12%</p></div><button class="gbtn" id="up">🪙 ${F(c)} 升级</button></div><button class="gbtn good wide" id="boost">⚡ 生产冲刺</button>`);$('#up').onclick=()=>{if(S.coins<c)return toast('金币不足，先交付订单吧');S.coins-=c;S.lv[k]++;S.rep++;hud();toast(N[k]+'升级成功！');sound(850);building(k);save()};$('#boost').onclick=()=>{S.steel+=8*S.lv[k];S.total+=8*S.lv[k];earn(500*S.lv[k]);toast('冲刺完成，钢卷已入库');close()}}
Object.keys(N).forEach(k=>$('#'+k).onclick=()=>building(k));
function orders(){let p=Math.min(100,S.steel/50*100);open('客户订单中心','📋','完成合同，获得金币与声望',`<div class="card"><div class="row between"><div><span class="tag gold">重点工程</span><h3>城市轨道交通热轧卷</h3><p class="muted">客户：华北轨道装备集团</p></div><b style="font-size:48px">🌀</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="row between"><b>库存 ${S.steel.toFixed(1)}/50 吨</b><b>奖励 1.28万</b></div><button class="gbtn wide" id="deliver">${S.steel>=50?'装车交付':'继续生产'}</button></div><div class="card dark"><b>下一合同：新能源汽车用钢</b><p class="muted">工艺路线：预处理 → BOF → LF → RH → 连铸 → 热轧</p><span class="tag">${S.built.rh?'已解锁':'待解锁'}</span></div>`);$('#deliver').onclick=()=>{if(S.steel<50){close();return toast('钢卷正在生产，点击建筑可加速')}S.steel-=50;S.coins+=12800;S.rep+=2;S.orders++;hud();toast('订单交付成功！＋1.28万');sound(900);orders();save()}}
function expansion(){let A=[['raw','原料场','⛏️',10000,'保障矿石与煤炭供应'],['sinter','烧结','🏗️',16000,'提高高炉炉料质量'],['pellet','球团','🔵',22000,'优化炉料结构'],['pretreat','预处理','🧪',32000,'解锁高品质钢'],['lf','LF精炼','♨️',48000,'提升钢水洁净度'],['rh','RH精炼','🧯',76000,'解锁汽车用钢']],cards=A.map((v,i)=>{let[k,n,x,c,d]=v,b=S.built[k],ok=!i||S.built[A[i-1][0]];return `<div class="card facility ${ok?'':'locked'}"><div class="fi">${x}</div><h3>${n}</h3><p>${d}</p>${b?`<button class="gbtn good build" data-k="${k}" data-c="${Math.round(c*.45)}">升级 ${F(c*.45)}</button>`:ok?`<button class="gbtn build" data-k="${k}" data-c="${c}">建造 ${F(c)}</button>`:`<button class="gbtn gray">🔒 前置设施</button>`}</div>`}).join('');open('钢厂扩建蓝图','🏗️','建设完整联合钢铁企业，逐步解锁工艺',`<div class="grid">${cards}</div><div class="card dark"><b>区域建设进度</b><div class="bar"><i style="width:${Object.values(S.built).filter(Boolean).length/6*100}%"></i></div><small>已建成 ${Object.values(S.built).filter(Boolean).length}/6 个设施</small></div>`);document.querySelectorAll('.build').forEach(b=>b.onclick=()=>{let c=+b.dataset.c;if(S.coins<c)return toast('金币不足');S.coins-=c;S.built[b.dataset.k]=1;S.rep++;hud();toast('设施建设完成！');sound(820);expansion();save()})}
function energy(){let u=Math.min(98,62+7*S.lv.energy+(S.toggle.gas?8:0));open('能源控制中心','⚡','调度煤气、电力、余热与循环水',`<div class="stats"><div class="stat"><b>${u}%</b><span>煤气利用率</span></div><div class="stat"><b>${42+8*S.lv.energy}%</b><span>自发电比例</span></div><div class="stat"><b>${S.toggle.water?96:81}%</b><span>循环水利用率</span></div><div class="stat"><b>${(2.08-.08*S.lv.energy).toFixed(2)}</b><span>吨钢碳排</span></div></div><div class="card dark">${[['gas','煤气回收',u],['heat','余热发电',S.toggle.heat?78:18],['water','循环用水',S.toggle.water?96:63]].map(v=>`<div class="meter"><strong>${v[1]}</strong><div class="bar"><i style="width:${v[2]}%"></i></div><button class="toggle ${S.toggle[v[0]]?'on':''}" data-t="${v[0]}"></button></div>`).join('')}</div><button class="gbtn wide" id="eup">升级能源中心 · ${F(cost('energy'))}</button>`);document.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>{S.toggle[t.dataset.t]=+!S.toggle[t.dataset.t];energy();save()});$('#eup').onclick=()=>{let c=cost('energy');if(S.coins<c)return toast('金币不足');S.coins-=c;S.lv.energy++;hud();toast('能源中心升级成功');energy();save()}}
function hq(){open('钢铁集团总部','🏢','查看集团成长、战绩与专业指标',`<div class="stats"><div class="stat"><b>Lv.${Math.max(...Object.values(S.lv))+5}</b><span>集团等级</span></div><div class="stat"><b>${F(S.coins)}</b><span>流动资金</span></div><div class="stat"><b>${Math.floor(S.total)}t</b><span>累计钢卷</span></div><div class="stat"><b>${S.orders}</b><span>完成订单</span></div></div><div class="card"><b>🏅 集团成就</b><p>🔥 第一炉铁水　✅<br>🌀 第一卷钢　✅<br>🌱 绿色钢厂　${S.lv.energy>=4?'✅':'🔒'}<br>🚘 汽车钢专家　${S.built.rh?'✅':'🔒'}</p></div><div class="card dark"><b>专家指标</b><p class="muted">焦比 345 kg/t · 废钢比 15% · 吨钢能耗 582 kgce<br>煤气利用率 91% · 固废资源化率 96%</p></div><button class="gbtn gray" id="reset">重新开始试玩</button>`);$('#reset').onclick=()=>{if(confirm('清空当前试玩进度？')){localStorage.removeItem(K);location.reload()}}}
function daily(){let done=S.total>=60;open('每日任务','✅','完成轻量目标，领取经营奖励',`<div class="card"><div class="row between"><div><b>今日生产60吨热轧卷</b><p class="muted">进度 ${Math.min(60,Math.floor(S.total))}/60</p></div><button class="gbtn" id="dc">${S.daily?'已领取':done?'领取5000':'进行中'}</button></div><div class="bar"><i style="width:${Math.min(100,S.total/60*100)}%"></i></div></div>`);$('#dc').onclick=()=>{if(S.daily)return toast('今日奖励已领取');if(!done)return toast('继续生产即可完成');S.daily=1;earn(5000);daily()}}
function gift(){open('七日福利','🎁','连续登录，助力钢厂快速成长',`<div class="grid">${[1,2,3,4,5,6,7].map(d=>`<div class="card" style="text-align:center"><b>第${d}天</b><div style="font-size:30px">${d<=S.gift?'🎁':'🔒'}</div><small>${2000+1000*d}金币</small></div>`).join('')}</div><button class="gbtn wide" id="gc">领取今日福利</button>`);$('#gc').onclick=()=>{let k=K+new Date().toDateString();if(localStorage.getItem(k))return toast('今日已领取');localStorage.setItem(k,1);earn(2000+1000*S.gift);S.gift=Math.min(7,S.gift+1);gift();save()}}
$('#navOrder').onclick=$('#order').onclick=orders;$('#navExpand').onclick=expansion;$('#navEnergy').onclick=energy;$('#navHq').onclick=hq;$('#daily').onclick=daily;$('#gift').onclick=gift;$('#mission').onclick=()=>building(bottleneck());$('#navFactory').onclick=()=>toast('当前已在钢厂主场景');$('#chest').onclick=()=>{let k=K+'chest',t=+localStorage.getItem(k)||0;if(Date.now()-t<60000)return toast('宝箱正在冷却');localStorage.setItem(k,Date.now());earn(3000,78,68);toast('在线宝箱：金币＋3000')};document.querySelectorAll('[data-earn]').forEach((b,i)=>b.onclick=()=>{earn(+b.dataset.earn,45+i*25,25+i*12);b.hidden=1;setTimeout(()=>b.hidden=0,30000+i*5000)});
let last=Date.now();setInterval(()=>{let n=Date.now(),dt=Math.min(3,(n-last)/1000);last=n;let r=Math.min(S.lv.bf,S.lv.bof,S.lv.cast,S.lv.roll)*.04;S.steel+=r*dt;S.total+=r*dt;hud();save()},1000);hud();setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),450);toast('点击钢厂建筑即可升级生产线！')},1200);addEventListener('beforeunload',save)})();
</script>
</body>
</html>
