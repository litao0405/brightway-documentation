<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071827"><title>钢铁大亨 V3｜钢流挑战在线试玩</title><style>html,body{margin:0;height:100%;background:#071827;color:#fff;font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif}#l{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}b{color:#ffb52f;font-size:22px}p{color:#b9d7e9;line-height:1.6}</style></head><body><div id="l"><div><b>钢铁大亨 V3</b><p>正在点火开炉，加载钢流挑战……</p></div></div><script>(async()=>{if(!window.DecompressionStream)throw Error('浏览器版本过低，请使用最新版 Chrome、Edge 或 Safari');const root='https://raw.githubusercontent.com/litao0405/brightway-documentation/steel-tycoon-demo/steel-tycoon-demo/payload/',parts=await Promise.all([...Array(8)].map((_,i)=>fetch(root+i+'.txt?v=3').then(r=>{if(!r.ok)throw Error('资源加载失败 '+r.status);return r.text()}))),s=parts.join(''),u=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)),d=new DecompressionStream('gzip'),t=await new Response(new Blob([u]).stream().pipeThrough(d)).text();document.open();document.write(t);document.close()})().catch(e=>document.getElementById('l').innerHTML='<div><b>无法启动</b><p>'+e.message+'</p></div>')</script></body></html>
